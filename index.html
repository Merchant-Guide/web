<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>商家运营中心</title>
  <script>
    (function () {
      try {
        var theme = null;
        try { theme = localStorage.getItem('merc-theme'); } catch (_) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (_) {}
    })();
  </script>
  <style>
    :root, [data-theme="light"] {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --surface-hover: #f8fafc;
      --border: #e5e9f0;
      --border-strong: #d6dce6;
      --text: #1a2233;
      --text-muted: #64748b;
      --text-faint: #94a3b8;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.10);
      --accent-strong: #1d4ed8;
      --chip-bg: #eef2ff;
      --chip-text: #4338ca;
      --green: #16a34a;
      --shadow: 0 1px 3px rgba(16, 24, 40, 0.06), 0 8px 24px rgba(16, 24, 40, 0.05);
      --shadow-hover: 0 4px 12px rgba(16, 24, 40, 0.10), 0 12px 32px rgba(16, 24, 40, 0.08);
      --toolbar-bg: rgba(255, 255, 255, 0.92);
      --toolbar-border: #e5e9f0;
      --toolbar-text: #334155;
    }
    [data-theme="dark"] {
      --bg: #0b1220;
      --surface: #141c2e;
      --surface-hover: #1c2740;
      --border: #263147;
      --border-strong: #33405a;
      --text: #e8edf7;
      --text-muted: #9aa7bd;
      --text-faint: #6b7891;
      --accent: #4f8bff;
      --accent-soft: rgba(79, 139, 255, 0.14);
      --accent-strong: #6ca0ff;
      --chip-bg: rgba(99, 102, 241, 0.18);
      --chip-text: #a5b4fc;
      --green: #22c55e;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
      --shadow-hover: 0 4px 14px rgba(0, 0, 0, 0.35);
      --toolbar-bg: rgba(20, 28, 46, 0.92);
      --toolbar-border: #263147;
      --toolbar-text: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background-color .2s ease, color .2s ease;
      -webkit-font-smoothing: antialiased;
    }
    .toolbar {
      position: fixed; top: 16px; right: 16px; z-index: 60;
      display: flex; gap: 8px; align-items: center;
      background: var(--toolbar-bg);
      border: 1px solid var(--toolbar-border);
      border-radius: 12px; padding: 6px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .toolbar button {
      border: none; background: transparent; color: var(--toolbar-text);
      font-family: inherit; font-size: 13px; font-weight: 600;
      padding: 7px 14px; border-radius: 8px; cursor: pointer; transition: background .15s ease;
    }
    .toolbar button:hover { background: var(--accent-soft); color: var(--accent); }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 84px 24px 64px; }

    /* 头部（品牌 + 电商交互插画条） */
    header.top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 24px; flex-wrap: wrap; margin-bottom: 8px;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .logo {
      width: 50px; height: 50px; border-radius: 14px; flex-shrink: 0;
      background: linear-gradient(135deg, #2563eb, #4f8bff);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 23px; font-weight: 700; box-shadow: var(--shadow);
    }
    .brand h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
    .brand .sub { margin-top: 5px; color: var(--text-muted); font-size: 13.5px; }

    /* 顶部横幅 */
    .banner { width: 100%; height: auto; border-radius: 16px; box-shadow: var(--shadow); display: block; }

    /* 电商交互插画条 */
    .eco-strip {
      display: flex; align-items: center; gap: 26px; padding: 16px 22px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      box-shadow: var(--shadow);
    }
    .eco-art { display: flex; align-items: center; gap: 20px; }
    .eco-ic { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
      border-radius: 12px; background: var(--accent-soft); border: 1px solid var(--border);
      transition: transform .2s ease; cursor: default; }
    .eco-ic:hover { transform: translateY(-4px) scale(1.08); }
    .eco-ic svg { width: 28px; height: 28px; }
    .eco-text .t1 { font-size: 13px; font-weight: 700; color: var(--text); }
    .eco-text .t2 { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }

    /* 搜索 */
    .search-box { position: relative; max-width: 620px; margin: 22px auto 0; }
    .search-input-wrap { position: relative; }
    .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-faint); font-size: 16px; pointer-events: none; }
    .search-input {
      width: 100%; padding: 14px 46px 14px 46px; font-size: 15px; font-family: inherit;
      color: var(--text); background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: 14px; box-shadow: var(--shadow); outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .search-input::placeholder { color: var(--text-faint); }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
    .clear-btn { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); border: none; background: transparent; color: var(--text-faint); font-size: 16px; cursor: pointer; padding: 4px; display: none; line-height: 1; }
    .clear-btn:hover { color: var(--text); }
    .search-hints { max-width: 620px; margin: 14px auto 0; }
    .hints-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .hints-label { font-size: 12px; color: var(--text-faint); white-space: nowrap; }
    .hint-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--accent); background: var(--chip-bg); border-radius: 999px; padding: 6px 14px; cursor: pointer; border: none; font-family: inherit; transition: transform .1s ease, background .15s ease; }
    .hint-chip:hover { background: var(--accent-soft); transform: translateY(-1px); }
    .hint-chip .x { font-size: 11px; color: var(--text-faint); margin-left: 2px; }
    .hint-chip .x:hover { color: var(--text-muted); }

    /* 左右分栏 */
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 24px; margin-top: 30px; align-items: start; }
    .module { margin-bottom: 8px; }
    .module + .module { margin-top: 26px; }
    .module-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .module-num { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 30px; padding: 0 10px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; border-radius: 8px; }
    .module-title { font-size: 19px; font-weight: 700; }
    .module-desc { color: var(--text-muted); font-size: 13px; margin-left: 2px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
    a.card { display: block; text-decoration: none; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease; }
    a.card:hover { border-color: var(--accent); box-shadow: var(--shadow-hover); transform: translateY(-2px); }
    a.card .card-top { display: flex; align-items: flex-start; gap: 12px; }
    a.card .card-ic { flex-shrink: 0; width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 19px; background: var(--accent-soft); border: 1px solid var(--border); }
    a.card .card-body { flex: 1; min-width: 0; }
    a.card .card-title { font-size: 14.5px; font-weight: 600; line-height: 1.45; }
    a.card .card-desc { margin-top: 5px; font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }
    a.card .card-arrow { color: var(--text-faint); font-size: 16px; transition: color .15s ease, transform .15s ease; margin-top: 2px; }
    a.card:hover .card-arrow { color: var(--accent); transform: translate(2px, -2px); }
    a.card .card-chip { display: inline-block; margin-top: 10px; font-size: 11px; font-weight: 600; color: var(--chip-text); background: var(--chip-bg); border-radius: 999px; padding: 3px 12px; }

    /* 最新通知 集合框（可鼠标滚动） */
    .notice-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
    .notice-list { max-height: 300px; overflow-y: auto; padding: 6px 16px; }
    .notice-list::-webkit-scrollbar { width: 5px; }
    .notice-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; }
    .notice-item { display: flex; align-items: center; gap: 10px; padding: 12px 6px; text-decoration: none; color: var(--text); border-bottom: 1px solid var(--border); transition: color .15s ease; }
    .notice-item:last-child { border-bottom: none; }
    .nl-tag { flex-shrink: 0; font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 3px 8px; }
    .nl-title { flex: 1; min-width: 0; font-size: 14px; font-weight: 500; }
    .nl-date { flex-shrink: 0; font-size: 12px; color: var(--text-faint); }
    .notice-item:hover { color: var(--accent); }
    .notice-item:hover .nl-title { color: var(--accent); }

    /* 操作指南 一行文字链接 */
    .guide-list { display: flex; flex-direction: column; gap: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 8px 16px; box-shadow: var(--shadow); max-height: 292px; overflow-y: auto; scrollbar-width: thin; }
    .guide-list::-webkit-scrollbar { width: 5px; }
    .guide-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; }
    .guide-list::-webkit-scrollbar-track { background: transparent; }
    .guide-link { display: flex; align-items: center; gap: 10px; padding: 11px 6px; text-decoration: none; color: var(--text); border-bottom: 1px solid var(--border); transition: color .15s ease; }
    .guide-link:last-child { border-bottom: none; }
    .guide-link .gl-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .guide-link .gl-txt { flex: 1; font-size: 14px; font-weight: 500; }
    .guide-link .gl-arrow { color: var(--text-faint); font-size: 14px; transition: color .15s ease, transform .15s ease; }
    .guide-link:hover { color: var(--accent); }
    .guide-link:hover .gl-arrow { color: var(--accent); transform: translate(3px, -2px); }

    /* 右侧联系运营栏 */
    aside.sidebar { position: sticky; top: 84px; }
    .side-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .side-head .ic { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; }
    .side-head h2 { margin: 0; font-size: 17px; font-weight: 700; }
    .contacts-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
    .contacts-note { padding: 13px 18px; font-size: 12.5px; color: var(--text-muted); background: var(--accent-soft); border-bottom: 1px solid var(--border); line-height: 1.6; }
    .contacts-note strong { color: var(--accent); }
    .work-hours { padding: 14px 18px; border-bottom: 1px solid var(--border); }
    .work-hours-title { font-size: 14px; font-weight: 700; margin-bottom: 9px; display: flex; align-items: center; gap: 7px; }
    .work-hours-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; padding: 5px 0; }
    .work-hours-row:first-of-type { margin-top: 1px; }
    .work-hours-row span:first-child { color: var(--text-muted); }
    .work-hours-row span:last-child { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
    .contact-group { padding: 16px 18px; }
    .contact-group + .contact-group { border-top: 1px solid var(--border); }
    .contact-group-title { font-size: 14px; font-weight: 700; margin-bottom: 3px; display: flex; align-items: center; gap: 8px; }
    .contact-group-tag { font-size: 11px; color: var(--text-faint); font-weight: 500; margin-left: auto; }
    .contact-group-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 11px; }
    .contact-list { display: flex; flex-direction: column; gap: 8px; }
    .contact-item { display: inline-flex; align-items: center; gap: 9px; width: 100%; background: var(--surface-hover); border: 1px solid var(--border); border-radius: 10px; padding: 9px 13px; cursor: pointer; font-family: inherit; color: var(--text); transition: border-color .15s ease; }
    .contact-item:hover { border-color: var(--accent); }
    .contact-item .cn { font-weight: 600; }
    .contact-item .en { color: var(--text-muted); font-size: 12px; margin-left: auto; }

    .no-result { text-align: center; padding: 36px 0; color: var(--text-muted); }
    .no-result .big { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    footer { margin-top: 48px; text-align: center; font-size: 12px; color: var(--text-faint); }
    .hidden { display: none !important; }

    @media (max-width: 900px) {
      .wrap { max-width: 760px; }
      .layout { grid-template-columns: 1fr; }
      aside.sidebar { position: static; }
      .eco-text { display: none; }
    }
    @media (max-width: 640px) {
      .wrap { padding: 78px 16px 40px; }
      .brand h1 { font-size: 22px; }
      .eco-art { gap: 14px; }
      .eco-ic { width: 40px; height: 40px; }
    }
  </style>
</head>

      { mod: "guide", title: "含焊丝、焊条、焊棒、焊电极商品的上架条件", url: "https://seller.kuajingmaihuo.com/questionnaire?surveyId=165992910143" },
      { mod: "guide", title: "禁售政策之电动工具及配件的非预期用途", url: "https://agentseller.temu.com/main/course/detail?courseId=10817560811" }
    ];

    // 顶部信息通知
    var NOTICES = [
      { title: "关于欧盟/英国进口商标签信息的最新通知", date: "2026-10-08", url: "https://seller.kuajingmaihuo.com/questionnaire?surveyId=86333213997" },
      { title: "常规店铺【发货享欧区流量增长】备货单专属权益及发货提醒", date: "2026-10-01", url: "https://seller.kuajingmaihuo.com/questionnaire?surveyId=202587065266" },
      { title: "内置电池类产品包装要求【最新版】", date: "2026-09-28", url: "https://agentseller.temu.com/main/course/detail?courseId=2505110000024" }
    ];

    var CONTACTS = {
      category: [
        { cn: "酱丁", en: "isla.shi" },
        { cn: "胡呱呱", en: "Ivy.hu" },
        { cn: "溟希贝", en: "ivyy.wang" },
        { cn: "木木槐", en: "joyce.hong" },
        { cn: "乾清冷", en: "jarena.liu" },
        { cn: "于瑾禾", en: "gina.wang" },
        { cn: "伏橘紫", en: "june.fu" },
        { cn: "栗山明", en: "gogo.yu" }
      ],
      supply: [
        { cn: "温舒格", en: "viola.li" }
      ]
    };

    var COMMON_TERMS = ["问卷", "改类目", "申诉", "欧代", "抽检", "推广"];
    var HISTORY_KEY = 'merc-search-history';
    var MAX_HISTORY = 5;

    // ================= 渲染链接 =================
    var MODS = {
      notice: "module-notice",
      survey: "module-survey",
      backend: "module-backend",
      guide: "module-guide"
    };
    var modContainers = {};
    Object.keys(MODS).forEach(function (m) {
      var section = document.getElementById(MODS[m]);
      modContainers[m] = section.querySelector('[data-module]');
    });

    var linkIndex = LINKS.map(function (item, idx) {
      return { idx: idx, hay: (item.title + " " + item.desc + " " + item.tag).toLowerCase() };
    });
    var noticeIndex = NOTICES.map(function (item, i) {
      return { idx: LINKS.length + i, hay: item.title.toLowerCase() };
    });
    var allIndex = linkIndex.concat(noticeIndex);

    // 搜索关联词映射：输入核心词时，联动展示相关词汇的结果，让搜索更丰富
    var SYNONYMS = {
      "限流": ["高价", "流量"],
      "半托管": ["本地仓", "本地仓模式"],
      "全托管": ["常规店铺"]
    };

    function renderAll() {
      LINKS.forEach(function (item, idx) {
        var mod = modContainers[item.mod];
        if (!mod) return;
        var a = document.createElement('a');
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.dataset.linkIndex = idx + '';
        if (item.mod === 'guide') {
          a.className = 'guide-link';
          a.href = item.url;
          a.innerHTML = '<span class="gl-dot"></span><span class="gl-txt">' + esc(item.title) + '</span><span class="gl-arrow">↗</span>';
          mod.appendChild(a);
          return;
        }
        a.className = 'card';
        a.href = item.url;
        a.innerHTML =
          '<div class="card-top">' +
            '<div class="card-ic">' + (item.icon || '🔗') + '</div>' +
            '<div class="card-body">' +
              '<div class="card-title">' + esc(item.title) + '</div>' +
              (item.desc ? '<div class="card-desc">' + esc(item.desc) + '</div>' : '') +
            '</div>' +
            '<div class="card-arrow">↗</div>' +
          '</div>' +
          '<span class="card-chip">' + esc(item.tag) + '</span>';
        mod.appendChild(a);
      });
    }

    // ================= 渲染信息通知（顶部滑动栏） =================
    function renderNotices() {
      var list = document.querySelector('#module-notice [data-module]');
      if (!list) return;
      NOTICES.forEach(function (item, i) {
        var a = document.createElement('a');
        a.className = 'notice-item';
        a.href = item.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.dataset.linkIndex = (LINKS.length + i) + '';
        a.innerHTML = '<span class="nl-tag">【通知】</span><span class="nl-title">' + esc(item.title) + '</span><span class="nl-date">' + esc(item.date || '') + '</span>';
        list.appendChild(a);
      });
    }

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ================= 渲染联系人 =================
    function renderContacts() {
      var cat = document.getElementById('contact-category');
      var sup = document.getElementById('contact-supply');
      CONTACTS.category.forEach(function (c) { cat.appendChild(makeContact(c)); });
      CONTACTS.supply.forEach(function (c) { sup.appendChild(makeContact(c)); });
    }
    function makeContact(c) {
      var b = document.createElement('button');
      b.className = 'contact-item';
      b.innerHTML = '<span class="cn">' + esc(c.cn) + '</span><span class="en">' + esc(c.en) + '</span>';
      b.addEventListener('click', function () { copyText(c.en + '（' + c.cn + '）'); });
      return b;
    }

    // ================= 搜索 =================
    var searchInput = document.getElementById('search');
    var clearBtn = document.getElementById('clear');

    function doSearch(q) {
      q = (q || '').trim().toLowerCase();
      var hasQuery = q.length > 0;
      document.querySelectorAll('.main-content .module').forEach(function (sec) { sec.classList.remove('hidden'); });
      document.getElementById('aside-contact').classList.remove('hidden');

      var anyHit = false;
      // 展开搜索词：本身 + 关联词，命中任一即展示
      var words = [q];
      if (hasQuery && SYNONYMS[q]) { words = SYNONYMS[q].concat([q]); }
      allIndex.forEach(function (li) {
        var el = document.querySelector('[data-link-index="' + li.idx + '"]');
        if (!el) return;
        var match = !hasQuery;
        if (hasQuery) {
          for (var w = 0; w < words.length; w++) {
            if (li.hay.indexOf(words[w]) >= 0) { match = true; break; }
          }
        }
        if (match) { el.classList.remove('hidden'); anyHit = true; }
        else { el.classList.add('hidden'); }
      });

      if (hasQuery) {
        Object.keys(MODS).forEach(function (m) {
          var container = modContainers[m];
          var visible = Array.prototype.some.call(container.querySelectorAll('[data-link-index]'), function (c) { return !c.classList.contains('hidden'); });
          document.getElementById(MODS[m]).classList.toggle('hidden', !visible);
        });
        var contactHit = false;
        document.querySelectorAll('.contact-group').forEach(function (g) {
          var match = g.textContent.toLowerCase().indexOf(q) >= 0;
          g.classList.toggle('hidden', !match);
          if (match) contactHit = true;
        });
        document.getElementById('aside-contact').classList.toggle('hidden', !contactHit);
        if (!anyHit && !contactHit) showNoResult(true); else showNoResult(false);
      } else {
        // 清空搜索回到主页：恢复被隐藏的联系组与右侧联系运营栏
        document.querySelectorAll('.contact-group').forEach(function (g) { g.classList.remove('hidden'); });
        var ac = document.getElementById('aside-contact');
        if (ac) ac.classList.remove('hidden');
        showNoResult(false);
      }
    }

    function showNoResult(show) {
      var nr = document.getElementById('no-result');
      if (show) {
        if (!nr) {
          nr = document.createElement('div');
          nr.id = 'no-result';
          nr.className = 'no-result';
          nr.innerHTML = '<div class="big">未找到相关入口</div><div>试试其他关键词，如：问卷 / 申诉 / 推广</div>';
          document.querySelector('.main-content').appendChild(nr);
        }
        nr.classList.remove('hidden');
      } else { if (nr) nr.classList.add('hidden'); }
    }

    searchInput.addEventListener('input', function () { clearBtn.style.display = this.value ? 'block' : 'none'; doSearch(this.value); });
    clearBtn.addEventListener('click', function () { searchInput.value = ''; clearBtn.style.display = 'none'; doSearch(''); searchInput.focus(); });
    searchInput.addEventListener('keydown', function (e) { if (e.key === 'Enter' && this.value.trim()) { pushHistory(this.value.trim()); doSearch(this.value.trim()); } });

    // ================= 常用 & 历史搜索 =================
    var commonEl = document.getElementById('common-hints');
    COMMON_TERMS.forEach(function (t) {
      var chip = document.createElement('button');
      chip.className = 'hint-chip';
      chip.textContent = t;
      chip.addEventListener('click', function () { searchInput.value = t; clearBtn.style.display='block'; doSearch(t); pushHistory(t); searchInput.focus(); });
      commonEl.appendChild(chip);
    });

    function getHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch (_) { return []; } }
    function pushHistory(term) {
      var h = getHistory().filter(function (x) { return x !== term; });
      h.unshift(term);
      if (h.length > MAX_HISTORY) h = h.slice(0, MAX_HISTORY);
      try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); } catch (_) {}
      renderHistory();
    }
    function renderHistory() {
      var hisEl = document.getElementById('history-hints');
      hisEl.innerHTML = '';
      var h = getHistory();
      var row = document.getElementById('history-row');
      if (!h.length) { row.style.display = 'none'; return; }
      row.style.display = '';
      h.forEach(function (t) {
        var chip = document.createElement('button');
        chip.className = 'hint-chip';
        chip.innerHTML = esc(t) + '<span class="x">✕</span>';
        chip.querySelector('.x').addEventListener('click', function (e) {
          e.stopPropagation();
          var nh = getHistory().filter(function (x) { return x !== t; });
          try { localStorage.setItem(HISTORY_KEY, JSON.stringify(nh)); } catch (_) {}
          renderHistory();
        });
        chip.addEventListener('click', function () { searchInput.value = t; clearBtn.style.display='block'; doSearch(t); searchInput.focus(); });
        hisEl.appendChild(chip);
      });
    }

    // ================= 复制 =================
    function copyText(text) {
      var done = function () { flash('已复制：' + text); };
      var fail = function () { flash('复制失败：' + text); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, fail);
      } else {
        var ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch (_) { fail(); }
        document.body.removeChild(ta);
      }
    }
    function flash(msg) {
      var el = document.getElementById('toast');
      document.body.appendChild(el);
      el.textContent = msg; el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(function () { el.classList.remove('show'); }, 1800);
    }
    (function () {
      var s = document.createElement('style');
      s.textContent = '#toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:10px;font-size:14px;opacity:0;z-index:100;transition:opacity .2s ease,transform .2s ease;pointer-events:none;box-shadow:var(--shadow-hover)}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}';
      document.head.appendChild(s);
    })();

    // ================= 主题 =================
    document.getElementById('theme-toggle').addEventListener('click', function () {
      var root = document.documentElement;
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('merc-theme', next); } catch (_) {}
    });

    // ================= 初始化 =================
    renderAll();
    renderNotices();
    renderContacts();
    renderHistory();
  </script>
</body>
</html>
